========================================= */

.answers {
    display: grid;

.answer-btn {
    width: 100%;

    padding: 16px 17px;

    text-align: left;

    background: var(--white);
    color: var(--dark);

    border: 2px solid #d8d8d8;

    border-radius: 10px;

    font-family: inherit;

    font-size: 16px;

    line-height: 1.4;

    cursor: pointer;

.answer-btn:hover:not(:disabled) {
    border-color: var(--slate);

.answer-btn.wrong {
    border-color: var(--red);

function shuffle(array) {

    const copy =
        [...array];


    for (
        let i = copy.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            copy[i],
            copy[j]
        ] =
        [
            copy[j],
            copy[i]
        ];

    }


    return copy;

}



/* =========================================================
   UPDATE PROGRESS
========================================================= */

function updateProgress() {

    const percent =
        Math.round(
            (
                completedQuestions /
                totalQuestions
            ) * 100
        );


    progressBar.style.width =
        percent + "%";


    progressPercent.textContent =
        percent + "%";


    /*
    Entire lesson complete
    */

    if (
        sectionIndex >=
        lesson.length
    ) {

        progressText.textContent =
            "Complete";

        return;

    }


    /*
    Currently watching a video
    */

    if (
        questionIndex === -1
    ) {

        progressText.textContent =
            `Video ${sectionIndex + 1} of ${lesson.length}`;

        return;

    }


    /*
    Currently answering questions
    */

    const section =
        lesson[
            sectionIndex
        ];


    progressText.textContent =
        `${section.title} — Question ${questionIndex + 1} of ${section.questions.length}`;

}



/* =========================================================
   DISPLAY VIDEO
========================================================= */

function renderVideo() {

    questionIndex =
        -1;


    updateProgress();


    /*
    Remove previous YouTube player.
    */

    if (
        youtubePlayer &&
        typeof youtubePlayer.destroy ===
            "function"
    ) {

        try {

            youtubePlayer.destroy();

        }

        catch (error) {

            console.log(
                error
            );

        }

    }


    youtubePlayer =
        null;


    const section =
        lesson[
            sectionIndex
        ];


    panel.innerHTML = `

        <div class="eyebrow">

            Video
            ${sectionIndex + 1}
            of
            ${lesson.length}

        </div>


        <h2>

            ${section.title}

        </h2>


        <div class="video-wrapper">

            <div id="youtubePlayer"></div>

        </div>


        <p class="helper">

            You may pause, rewind, or fast-forward the video.

            Continue will appear when the video reaches the end.

        </p>


        <button
            class="primary-btn continue-btn"
            id="continueBtn"
            type="button">

            Continue to Questions →

        </button>

    `;


    waitForYouTubeAPI(
        section.youtubeId
    );

}



/* =========================================================
   WAIT UNTIL YOUTUBE API IS READY
========================================================= */

function waitForYouTubeAPI(
    videoId
) {

    if (
        youtubeAPIReady &&
        window.YT &&
        YT.Player
    ) {

        createYouTubePlayer(
            videoId
        );


        return;

    }


    setTimeout(
        function () {

            waitForYouTubeAPI(
                videoId
            );

        },

        100
    );

}



/* =========================================================
   CREATE YOUTUBE PLAYER
========================================================= */

function createYouTubePlayer(
    videoId
) {

    youtubePlayer =
        new YT.Player(
            "youtubePlayer",
            {

                videoId:
                    videoId,

                playerVars: {

                    controls: 1,

                    rel: 0,

                    playsinline: 1,

                    modestbranding: 1

                },

                events: {

                    onStateChange:
                        handleYouTubeStateChange

                }

            }
        );

}



/* =========================================================
   DETECT WHEN VIDEO ENDS
========================================================= */

function handleYouTubeStateChange(
    event
) {

    if (
        event.data ===
        YT.PlayerState.ENDED
    ) {

        const continueButton =
            document.getElementById(
                "continueBtn"
            );


        if (
            continueButton
        ) {

            continueButton.style.display =
                "inline-block";


            continueButton.onclick =
                function () {

                    questionIndex =
                        0;


                    renderQuestion();

                };

        }

    }

}



/* =========================================================
   DISPLAY QUESTION
========================================================= */

function renderQuestion() {

    updateProgress();


    const section =
        lesson[
            sectionIndex
        ];


    const item =
        section.questions[
            questionIndex
        ];


    /*
    Reset state for new question.
    */

    questionHadWrongAttempt =
        false;


    questionLocked =
        false;


    /*
    Randomize response order.
    */

    randomizedAnswers =
        shuffle(
            item.answers
        );


    const answersHTML =
        randomizedAnswers
            .map(

                (
                    answer,
                    index
                ) => `

                    <button
                        class="answer-btn"
                        type="button"
                        data-index="${index}">

                        ${answer.text}

                    </button>

                `

            )
            .join("");


    panel.innerHTML = `

        <div class="eyebrow">

            ${section.title}

        </div>


        <h2>

            Knowledge Check

        </h2>


        <div class="question">

            ${item.question}

        </div>


        <div class="answers">

            ${answersHTML}

        </div>


        <div class="question-counter">

            Question
            ${questionIndex + 1}
            of
            ${section.questions.length}

        </div>

    `;


    const answerButtons =
        [
            ...document.querySelectorAll(
                ".answer-btn"
            )
        ];


    answerButtons.forEach(
        button => {

            button.addEventListener(
                "click",
                function () {


                    /*
                    Ignore clicks once answered.
                    */

                    if (
                        questionLocked
                    ) {

                        return;

                    }


                    const selectedIndex =
                        Number(
                            button.dataset.index
                        );


                    const selectedAnswer =
                        randomizedAnswers[
                            selectedIndex
                        ];



                    /* =================================
                       WRONG RESPONSE
                    ================================= */

                    if (
                        !selectedAnswer.correct
                    ) {

                        /*
                        Mark question as missed.
                        */

                        questionHadWrongAttempt =
                            true;


                        /*
                        Turn selected answer red.
                        */

                        button.classList.add(
                            "wrong"
                        );


                        /*
                        Don't allow same wrong answer
                        to be clicked repeatedly.
                        */

                        button.disabled =
                            true;


                        /*
                        This is where backend reporting
                        can be added later.
                        */


                        showWrongPopup();


                        return;

                    }



                    /* =================================
                       CORRECT RESPONSE
                    ================================= */

                    questionLocked =
                        true;


                    /*
                    Turn selected response green.
                    */

                    button.classList.add(
                        "correct"
                    );


                    /*
                    Disable all answer buttons.
                    */

                    answerButtons.forEach(
                        btn => {

                            btn.disabled =
                                true;

                        }
                    );


                    /*
                    Award one point only if
                    correct on first attempt.
                    */

                    if (
                        !questionHadWrongAttempt
                    ) {

                        score++;

                    }


                    /*
                    Update completed question count.
                    */

                    completedQuestions++;


                    updateProgress();


                    showCorrectPopup();

                }
            );

        }
    );

}



/* =========================================================
   WRONG ANSWER POPUP
========================================================= */

function showWrongPopup() {

    feedbackModal.className =
        "modal wrong";


    feedbackTitle.textContent =
        "Try Again";


    feedbackText.textContent =
        "That response is not correct. Try another answer.";


    feedbackButton.textContent =
        "Try Again";


    feedbackBackdrop.classList.add(
        "show"
    );


    feedbackBackdrop.setAttribute(
        "aria-hidden",
        "false"
    );


    feedbackButton.focus();


    feedbackButton.onclick =
        function () {

            closeFeedback();

        };

}



/* =========================================================
   CORRECT ANSWER POPUP
========================================================= */

function showCorrectPopup() {

    feedbackModal.className =
        "modal correct";


    feedbackTitle.textContent =
        "Correct!";


    feedbackText.textContent =
        "You got it right.";


    feedbackButton.textContent =
        "Continue";


    feedbackBackdrop.classList.add(
        "show"
    );


    feedbackBackdrop.setAttribute(
        "aria-hidden",
        "false"
    );


    feedbackButton.focus();


    feedbackButton.onclick =
        function () {


            closeFeedback();


            const section =
                lesson[
                    sectionIndex
                ];


            /*
            More questions remain
            after this video.
            */

            if (
                questionIndex <
                section.questions.length - 1
            ) {

                questionIndex++;


                renderQuestion();


                return;

            }


            /*
            Finished this section.
            */

            moveToNextVideo();

        };

}



/* =========================================================
   CLOSE FEEDBACK POPUP
========================================================= */

function closeFeedback() {

    feedbackBackdrop.classList.remove(
        "show"
    );


    feedbackBackdrop.setAttribute(
        "aria-hidden",
        "true"
    );

}



/* =========================================================
   MOVE TO NEXT VIDEO
========================================================= */

function moveToNextVideo() {

    sectionIndex++;


    /*
    Entire lesson finished.
    */

    if (
        sectionIndex >=
        lesson.length
    ) {

        renderCompletion();


        return;

    }


    /*
    Load next video.
    */

    renderVideo();


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}



/* =========================================================
   COMPLETION SCREEN
========================================================= */

function renderCompletion() {

    questionIndex =
        -1;


    updateProgress();


    panel.innerHTML = `

        <div class="complete">


            <div class="complete-mark">

                ✓

            </div>


            <h2>

                Lesson Complete

            </h2>


            <p class="complete-text">

                You completed all six videos
                and knowledge checks.

            </p>


            <div
                class="final-score"
                aria-label="Your total score is ${score} out of ${totalQuestions}">

                Your total score is

                <strong>

                    ${score}/${totalQuestions}

                </strong>.

            </div>


        </div>

    `;

}



/* =========================================================
   POPUP BEHAVIOR
========================================================= */

/*
Clicking outside the popup closes
a WRONG-answer popup.

Students must click Continue after
a correct response.
*/

feedbackBackdrop.addEventListener(
    "click",
    function (
        event
    ) {

        if (
            event.target ===
                feedbackBackdrop &&
            feedbackModal.classList.contains(
                "wrong"
            )
        ) {

            closeFeedback();

        }

    }
);



/*
Escape key also closes
a wrong-answer popup.
*/

document.addEventListener(
    "keydown",
    function (
        event
    ) {

        if (
            event.key ===
                "Escape" &&
            feedbackBackdrop.classList.contains(
                "show"
            ) &&
            feedbackModal.classList.contains(
                "wrong"
            )
        ) {

            closeFeedback();

        }

    }
);



/* =========================================================
   START LESSON
========================================================= */

renderVideo();

</script>


</body>
</html>
