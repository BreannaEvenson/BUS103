<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>$100K Startup Budget Challenge | Cupcakes & Shakes</title>

<style>
:root {
    --red: #C8102E;
    --red-dark: #970C23;
    --black: #171717;
    --charcoal: #333333;
    --gray: #666666;
    --light-gray: #F3F3F3;
    --border: #D6D6D6;
    --white: #FFFFFF;

    --green: #217A45;
    --green-bg: #EAF6EE;

    --yellow: #8A6200;
    --yellow-bg: #FFF7DA;

    --danger: #A82121;
    --danger-bg: #FCEBEB;

    --blue: #24577A;
    --blue-bg: #EDF5FA;

    --shadow: 0 5px 18px rgba(0,0,0,.08);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #EDEDED;
    color: var(--black);
    font-family: Arial, Helvetica, sans-serif;
    line-height: 1.5;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

#app {
    max-width: 1180px;
    margin: 0 auto;
    min-height: 100vh;
    background: white;
}

/* =========================================================
   HEADER
   ========================================================= */

.top-header {
    background: var(--black);
    color: white;
    border-top: 9px solid var(--red);
    padding: 21px 5% 17px;
}

.top-header-inner {
    max-width: 1080px;
    margin: 0 auto;
}

.game-label {
    display: inline-block;
    background: var(--red);
    padding: 5px 10px;
    border-radius: 4px;
    font-size: .73rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .08em;
    margin-bottom: 8px;
}

.top-header h1 {
    margin: 0;
    line-height: 1.1;
    font-size: clamp(1.6rem, 3vw, 2.35rem);
}

.progress-wrap {
    margin-top: 15px;
}

.progress-track {
    height: 8px;
    background: #454545;
    border-radius: 20px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    background: var(--red);
    transition: width .3s ease;
}

.progress-text {
    margin-top: 5px;
    color: #D7D7D7;
    font-size: .8rem;
}

/* =========================================================
   RUNNING SCORE
   ========================================================= */

.status-wrap {
    background: white;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 20;
    box-shadow: 0 2px 7px rgba(0,0,0,.05);
}

.status-bar {
    max-width: 1080px;
    margin: 0 auto;
    padding: 10px 5%;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 9px;
}

.status-card {
    background: var(--light-gray);
    border-radius: 6px;
    padding: 8px 10px;
    text-align: center;
}

.status-card span {
    display: block;
    color: var(--gray);
    font-size: .66rem;
    text-transform: uppercase;
    font-weight: bold;
    letter-spacing: .04em;
}

.status-card strong {
    display: block;
    font-size: 1.08rem;
}

.status-card.rep strong {
    color: var(--red);
}

/* =========================================================
   PAGE
   ========================================================= */

.page-content {
    max-width: 1080px;
    margin: 0 auto;
    padding: 28px 5% 65px;
}

.eyebrow {
    color: var(--red);
    font-size: .78rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .08em;
    margin-bottom: 7px;
}

h2 {
    font-size: clamp(1.65rem, 4vw, 2.35rem);
    line-height: 1.12;
    margin: 0 0 15px;
}

h3 {
    margin-top: 0;
}

.lead {
    font-size: 1.08rem;
    color: #3E3E3E;
}

.rule {
    width: 72px;
    height: 5px;
    background: var(--red);
    margin: 18px 0 24px;
}

.scenario {
    border-left: 7px solid var(--red);
    background: var(--light-gray);
    border-radius: 7px;
    padding: 21px 23px;
    margin: 22px 0;
    box-shadow: var(--shadow);
}

.scenario p:last-child {
    margin-bottom: 0;
}

/* =========================================================
   ALWAYS-VISIBLE BUDGET PANEL
   ========================================================= */

.business-dashboard {
    margin-bottom: 31px;
}

.dashboard-heading {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    align-items: center;
    background: var(--black);
    color: white;
    border-radius: 8px 8px 0 0;
    padding: 12px 16px;
}

.dashboard-heading h3 {
    margin: 0;
    font-size: 1rem;
}

.dashboard-total {
    font-size: .9rem;
}

.balance-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    border: 1px solid var(--border);
    border-top: 0;
    border-radius: 0 0 8px 8px;
    overflow: hidden;
}

.balance-item {
    padding: 12px;
    background: white;
    border-right: 1px solid var(--border);
    border-top: 1px solid var(--border);
}

.balance-item:nth-child(4n) {
    border-right: 0;
}

.balance-item span {
    display: block;
    color: var(--gray);
    font-size: .67rem;
    text-transform: uppercase;
    font-weight: bold;
}

.balance-item strong {
    display: block;
    margin-top: 2px;
    font-size: 1rem;
}

.balance-item.revenue-box {
    background: #F8F8F8;
}

/* =========================================================
   CALLOUTS
   ========================================================= */

.callout {
    border-radius: 7px;
    padding: 17px 19px;
    margin: 18px 0;
}

.callout.good {
    background: var(--green-bg);
    border: 1px solid #A6D4B5;
}

.callout.warning {
    background: var(--yellow-bg);
    border: 1px solid #DFC871;
}

.callout.bad {
    background: var(--danger-bg);
    border: 1px solid #E1A8A8;
}

.callout.info {
    background: var(--blue-bg);
    border: 1px solid #B5D0DF;
}

.big-number {
    font-size: 1.65rem;
    font-weight: 800;
    color: var(--red);
}

/* =========================================================
   CATEGORY EXPLANATIONS
   ========================================================= */

.category-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0,1fr));
    gap: 15px;
    margin: 23px 0;
}

.category-card {
    border: 1px solid var(--border);
    border-top: 5px solid var(--red);
    border-radius: 7px;
    padding: 16px;
    background: white;
}

.category-card h3 {
    font-size: 1rem;
    margin-bottom: 5px;
}

.category-card p {
    margin: 0;
    color: var(--gray);
    font-size: .91rem;
}

/* =========================================================
   FORMS
   ========================================================= */

.budget-form {
    margin-top: 24px;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
}

.form-title {
    background: var(--black);
    color: white;
    padding: 16px 19px;
}

.form-title h3 {
    margin: 0 0 3px;
}

.form-title p {
    color: #DDD;
    margin: 0;
    font-size: .9rem;
}

.form-body {
    padding: 20px;
}

.money-row {
    display: grid;
    grid-template-columns: minmax(0,1fr) 180px;
    gap: 15px;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #E5E5E5;
}

.money-row:last-child {
    border-bottom: 0;
}

.money-row label {
    font-weight: bold;
}

.money-row small {
    display: block;
    color: var(--gray);
    font-weight: normal;
}

.money-input-wrap {
    position: relative;
}

.money-input-wrap::before {
    content: "$";
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: #666;
    font-weight: bold;
}

.money-input {
    width: 100%;
    border: 2px solid #AAA;
    border-radius: 5px;
    padding: 9px 9px 9px 26px;
}

.money-input:focus {
    outline: 3px solid rgba(200,16,46,.13);
    border-color: var(--red);
}

.total-box {
    background: var(--light-gray);
    border-radius: 6px;
    padding: 12px 14px;
    margin-top: 15px;
    display: flex;
    justify-content: space-between;
    gap: 20px;
    font-weight: bold;
}

.total-box.good {
    background: var(--green-bg);
    color: var(--green);
}

.total-box.over {
    background: var(--danger-bg);
    color: var(--danger);
}

/* =========================================================
   DECISION BUTTONS
   ========================================================= */

.decision-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0,1fr));
    gap: 16px;
    margin: 24px 0;
}

.decision {
    width: 100%;
    text-align: left;
    background: white;
    border: 2px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    transition: .15s ease;
}

.decision:hover:not(:disabled),
.decision.selected {
    border-color: var(--red);
    box-shadow: 0 4px 15px rgba(200,16,46,.12);
}

.decision.selected {
    background: #FFF7F8;
}

.decision strong {
    display: block;
    font-size: 1.07rem;
    margin-bottom: 5px;
}

.decision span {
    color: var(--gray);
    font-size: .91rem;
}

.decision:disabled {
    opacity: .48;
    cursor: not-allowed;
}

/* =========================================================
   BUTTONS
   ========================================================= */

.button-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 27px;
}

.primary {
    border: none;
    background: var(--red);
    color: white;
    padding: 12px 19px;
    border-radius: 5px;
    font-weight: 800;
}

.primary:hover {
    background: var(--red-dark);
}

.secondary {
    border: none;
    background: var(--black);
    color: white;
    padding: 12px 19px;
    border-radius: 5px;
    font-weight: 800;
}

.error-box {
    display: none;
    margin-top: 14px;
    background: var(--danger-bg);
    color: var(--danger);
    border: 1px solid #DFA7A7;
    border-radius: 5px;
    padding: 11px 13px;
    font-weight: bold;
}

/* =========================================================
   FINAL
   ========================================================= */

.final-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0,1fr));
    gap: 17px;
    margin: 27px 0;
}

.final-card {
    padding: 24px;
    border-radius: 9px;
    text-align: center;
    background: var(--light-gray);
}

.final-card span {
    display: block;
    color: var(--gray);
    font-size: .75rem;
    text-transform: uppercase;
    font-weight: bold;
}

.final-card strong {
    display: block;
    font-size: 2rem;
    margin-top: 5px;
}

.overall-score {
    background: var(--black);
    color: white;
    border-radius: 10px;
    padding: 27px;
    text-align: center;
    margin: 25px 0;
}

.score-number {
    font-size: 4rem;
    font-weight: 900;
    line-height: 1;
}

.score-number span {
    font-size: 1.4rem;
    color: #CCC;
}

.result-title {
    margin-top: 11px;
    font-weight: bold;
    font-size: 1.35rem;
}

/* =========================================================
   FOOTER
   ========================================================= */

.footer-controls {
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 5% 35px;
    text-align: right;
}

.reset-link {
    border: none;
    background: none;
    color: #777;
    text-decoration: underline;
    font-size: .8rem;
}

/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 760px) {

    .status-bar {
        grid-template-columns: repeat(2, 1fr);
    }

    .balance-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .balance-item:nth-child(4n) {
        border-right: 1px solid var(--border);
    }

    .balance-item:nth-child(2n) {
        border-right: 0;
    }

    .category-grid,
    .decision-grid,
    .final-grid {
        grid-template-columns: 1fr;
    }

    .money-row {
        grid-template-columns: 1fr;
    }

    .dashboard-heading {
        align-items: flex-start;
        flex-direction: column;
    }
}

</style>
</head>

<body>

<div id="app"></div>

<script>

/* =========================================================
   GAME SETTINGS
   ========================================================= */

const STARTING_BUDGET = 100000;

const CATEGORY_META = [
    {
        key: "location",
        label: "Location / Building",
        description: "Lease deposits, renovations, signage, storefront improvements, and future location costs."
    },
    {
        key: "equipment",
        label: "Equipment",
        description: "Ovens, mixers, refrigerators, commercial shake machines, POS systems, and other equipment."
    },
    {
        key: "inventory",
        label: "Inventory",
        description: "Ingredients, cups, straws, toppings, packaging, and supplies needed to serve customers."
    },
    {
        key: "payroll",
        label: "Payroll",
        description: "Money set aside specifically to pay employees."
    },
    {
        key: "marketing",
        label: "Marketing",
        description: "Advertising, social media, promotions, and other efforts to attract customers."
    },
    {
        key: "insurance",
        label: "Insurance",
        description: "Business liability and other coverage that protects the company when something goes wrong."
    },
    {
        key: "reserves",
        label: "Cash Reserves",
        description: "Flexible emergency money available for unexpected expenses."
    }
];

const TOTAL_STAGES = 25;

const STORAGE_KEY =
    "svccCupcakesShakes100KGameV2";


/* =========================================================
   STARTING STATE
   ========================================================= */

function freshState() {

    return {

        stage: 0,

        reputation: 50,

        totalRevenue: 0,

        availableRevenue: 0,

        ownerPayout: 0,

        currentMonthOwnerPayout: 0,

        lastMonthOwnerPayout: 0,

        categories: {
            location: 0,
            equipment: 0,
            inventory: 0,
            payroll: 0,
            marketing: 0,
            insurance: 0,
            reserves: 0
        },

        initialEquipmentInvestment: 0,

        marketingChoice: null,

        equipmentChoice: null,

        retirementChoice: null,

        attorneyChoice: null,

        employeeChoice: null,

        expansionChoice: null,

        applied: {},

        events: {}
    };
}

let state = loadState();


/* =========================================================
   SAVE / LOAD
   ========================================================= */

function loadState() {

    try {

        const saved =
            localStorage.getItem(STORAGE_KEY);

        if (saved) {
            return JSON.parse(saved);
        }

    } catch (error) {}

    return freshState();
}


function persist() {

    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(state)
        );

    } catch (error) {}
}


/* =========================================================
   BASIC HELPERS
   ========================================================= */

function money(value) {

    const number =
        Number(value || 0);

    return new Intl.NumberFormat(
        "en-US",
        {
            style: "currency",
            currency: "USD",
            maximumFractionDigits: 0
        }
    ).format(number);
}


function cleanNum(value) {

    const number =
        Number(value);

    if (
        !Number.isFinite(number) ||
        number < 0
    ) {
        return 0;
    }

    return Math.round(number);
}


function readMoney(id) {

    const element =
        document.getElementById(id);

    return cleanNum(
        element ? element.value : 0
    );
}


function sumCategories() {

    return Object.values(state.categories)
        .reduce(
            (total, amount) =>
                total + Number(amount || 0),
            0
        );
}


function earnRevenue(amount) {

    state.totalRevenue += amount;

    state.availableRevenue += amount;
}


function addOwnerPayout(amount) {

    state.ownerPayout += amount;

    state.currentMonthOwnerPayout += amount;
}


function adjustReputation(amount) {

    state.reputation += amount;

    if (state.reputation < 0) {
        state.reputation = 0;
    }
}


/* =========================================================
   PAYROLL
   ========================================================= */

function processPayroll(amount) {

    let remaining = amount;


    const fromPayroll =
        Math.min(
            state.categories.payroll,
            remaining
        );

    state.categories.payroll -=
        fromPayroll;

    remaining -= fromPayroll;


    const fromReserves =
        Math.min(
            state.categories.reserves,
            remaining
        );

    state.categories.reserves -=
        fromReserves;

    remaining -= fromReserves;


    let reputationPenalty = 0;


    if (remaining > 0) {

        reputationPenalty = 5;

        adjustReputation(-5);
    }


    return {

        amount,

        fromPayroll,

        fromReserves,

        shortfall: remaining,

        reputationPenalty
    };
}


/* =========================================================
   PAY OTHER COSTS
   ========================================================= */

function payFromReservesThenRevenue(amount) {

    let remaining = amount;


    const fromReserves =
        Math.min(
            state.categories.reserves,
            remaining
        );

    state.categories.reserves -=
        fromReserves;

    remaining -= fromReserves;


    const fromRevenue =
        Math.min(
            state.availableRevenue,
            remaining
        );

    state.availableRevenue -=
        fromRevenue;

    remaining -= fromRevenue;


    return {

        amount,

        fromReserves,

        fromRevenue,

        shortfall: remaining
    };
}


/* =========================================================
   HEADER
   ========================================================= */

function progressPercent() {

    return Math.min(
        100,
        Math.round(
            (
                state.stage /
                (TOTAL_STAGES - 1)
            ) * 100
        )
    );
}


function headerHTML() {

    return `
        <header class="top-header">

            <div class="top-header-inner">

                <div class="game-label">
                    Small Business Simulation
                </div>

                <h1>
                    $100K Startup Budget:
                    Cupcakes &amp; Shakes
                </h1>

                <div class="progress-wrap">

                    <div class="progress-track">

                        <div
                            class="progress-bar"
                            style="width:${progressPercent()}%">
                        </div>

                    </div>

                    <div class="progress-text">
                        Simulation progress:
                        ${progressPercent()}%
                    </div>

                </div>

            </div>

        </header>
    `;
}


/* =========================================================
   RUNNING SCORE
   ALWAYS SHOWN
   ========================================================= */

function statusHTML() {

    return `
        <div class="status-wrap">

            <div class="status-bar">

                <div class="status-card rep">

                    <span>
                        Reputation
                    </span>

                    <strong>
                        ${state.reputation} pts
                    </strong>

                </div>


                <div class="status-card">

                    <span>
                        Total Revenue
                    </span>

                    <strong>
                        ${money(state.totalRevenue)}
                    </strong>

                </div>


                <div class="status-card">

                    <span>
                        Owner Payout
                    </span>

                    <strong>
                        ${money(state.ownerPayout)}
                    </strong>

                </div>


                <div class="status-card">

                    <span>
                        Unallocated Revenue
                    </span>

                    <strong>
                        ${money(state.availableRevenue)}
                    </strong>

                </div>

            </div>

        </div>
    `;
}


/* =========================================================
   CURRENT BUDGET
   ALWAYS SHOWN
   ========================================================= */

function balancePanelHTML() {

    return `
        <section class="business-dashboard">

            <div class="dashboard-heading">

                <h3>
                    Current Business Budget
                </h3>

                <div class="dashboard-total">
                    Total in Budget Categories:
                    <strong>
                        ${money(sumCategories())}
                    </strong>
                </div>

            </div>


            <div class="balance-grid">

                ${CATEGORY_META.map(cat => `

                    <div class="balance-item">

                        <span>
                            ${cat.label}
                        </span>

                        <strong>
                            ${money(
                                state.categories[cat.key]
                            )}
                        </strong>

                    </div>

                `).join("")}


                <div class="balance-item revenue-box">

                    <span>
                        Unallocated Revenue
                    </span>

                    <strong>
                        ${money(
                            state.availableRevenue
                        )}
                    </strong>

                </div>

            </div>

        </section>
    `;
}


/* =========================================================
   PAGE SHELL
   EVERY PAGE GETS:
   - RUNNING SCORE
   - CURRENT BUDGET
   ========================================================= */

function pageShell(content) {

    return `

        ${headerHTML()}

        ${statusHTML()}


        <main class="page-content">

            ${balancePanelHTML()}

            ${content}

        </main>


        <div class="footer-controls">

            <button
                class="reset-link"
                onclick="resetGame()">

                Restart Simulation

            </button>

        </div>
    `;
}


/* =========================================================
   NAVIGATION
   ========================================================= */

function goToStage(stage) {

    state.stage = stage;

    persist();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

    render();
}


function nextStage() {

    goToStage(
        state.stage + 1
    );
}


/* =========================================================
   AUTOMATIC SCENARIO RESULTS
   ========================================================= */

function applyStageEvent() {

    const s =
        state.stage;


    if (state.applied[s]) {
        return;
    }


    /* =====================================================
       PAGE 2 - GRAND OPENING
       ===================================================== */

    if (s === 1) {

        if (
            state.categories.inventory >=
            20000
        ) {

            state.categories.inventory -=
                20000;

            earnRevenue(45000);

            adjustReputation(5);


            state.events.grandOpening = {

                success: true,

                revenue: 45000,

                repChange: 5
            };

        } else {

            state.categories.inventory =
                0;

            earnRevenue(22000);

            adjustReputation(-20);


            state.events.grandOpening = {

                success: false,

                revenue: 22000,

                repChange: -20
            };
        }
    }


    /* =====================================================
       FIRST PAYROLL
       ===================================================== */

    if (s === 2) {

        state.events.payroll1 =
            processPayroll(10000);
    }


    /* =====================================================
       MARKETING RESULT + PAYROLL
       ===================================================== */

    if (s === 4) {

        if (
            state.marketingChoice ===
            "campaign"
        ) {

            state.categories.marketing -=
                8000;

            earnRevenue(32000);

            adjustReputation(5);


            state.events.marketingResult = {

                campaign: true,

                revenue: 32000,

                repChange: 5
            };

        } else {

            earnRevenue(20000);


            state.events.marketingResult = {

                campaign: false,

                revenue: 20000,

                repChange: 0
            };
        }


        state.events.payroll2 =
            processPayroll(10000);
    }


    /* =====================================================
       EQUIPMENT RESULT
       ===================================================== */

    if (s === 7) {

        if (
            state.initialEquipmentInvestment >=
            18000
        ) {

            earnRevenue(31000);


            state.events.equipmentResult = {

                type: "protected",

                revenue: 31000,

                repChange: 0
            };

        }

        else if (
            state.equipmentChoice ===
            "replace"
        ) {

            state.categories.reserves -=
                7500;

            earnRevenue(27000);

            adjustReputation(-1);


            state.events.equipmentResult = {

                type: "replace",

                revenue: 27000,

                repChange: -1
            };

        }

        else {

            earnRevenue(19000);

            adjustReputation(-8);


            state.events.equipmentResult = {

                type: "wait",

                revenue: 19000,

                repChange: -8
            };
        }
    }


    /* =====================================================
       HOLIDAY PAYROLL
       ===================================================== */

    if (s === 8) {

        state.events.holidayPayroll =
            processPayroll(15000);
    }


    /* =====================================================
       CHILD'S CAR
       ===================================================== */

    if (s === 9) {

        const ownerFunds =
            state.lastMonthOwnerPayout;


        const neededFromBusiness =
            Math.max(
                0,
                5000 - ownerFunds
            );


        let reserveUsed = 0;

        let shortfall = 0;


        if (
            neededFromBusiness > 0
        ) {

            reserveUsed =
                Math.min(
                    state.categories.reserves,
                    neededFromBusiness
                );


            state.categories.reserves -=
                reserveUsed;


            shortfall =
                neededFromBusiness -
                reserveUsed;
        }


        if (shortfall > 0) {

            adjustReputation(-2);
        }


        state.events.car = {

            ownerMoney:
                Math.min(
                    5000,
                    ownerFunds
                ),

            reserveUsed,

            shortfall,

            repChange:
                shortfall > 0
                ? -2
                : 0
        };
    }


    /* =====================================================
       NORMAL PAYROLL
       ===================================================== */

    if (s === 10) {

        state.events.payroll3 =
            processPayroll(10000);
    }


    /* =====================================================
       RETIREMENT PARTY RESULT
       ===================================================== */

    if (s === 13) {

        if (
            state.retirementChoice ===
            "accept" &&
            state.categories.inventory >=
            12000
        ) {

            state.categories.inventory -=
                12000;

            earnRevenue(35000);

            adjustReputation(10);


            state.events.retirement = {

                type: "success",

                revenue: 35000,

                repChange: 10
            };

        }

        else if (
            state.retirementChoice ===
            "accept"
        ) {

            state.categories.inventory =
                0;

            earnRevenue(16000);

            adjustReputation(-15);


            state.events.retirement = {

                type: "short",

                revenue: 16000,

                repChange: -15
            };

        }

        else {

            adjustReputation(-3);


            state.events.retirement = {

                type: "decline",

                revenue: 0,

                repChange: -3
            };
        }
    }


    /* =====================================================
       PAYROLL
       ===================================================== */

    if (s === 14) {

        state.events.payroll4 =
            processPayroll(10000);
    }


    /* =====================================================
       CUSTOMER ACCIDENT RESULT
       ===================================================== */

    if (s === 16) {

        const attorneyCost =
            state.attorneyChoice ===
            "expensive"
            ? 10000
            : 2000;


        const attorneyPayment =
            payFromReservesThenRevenue(
                attorneyCost
            );


        let deductible;


        if (
            state.categories.insurance >=
            15000
        ) {

            deductible = 1500;

        }

        else if (
            state.categories.insurance >=
            8000
        ) {

            deductible = 7500;

        }

        else {

            deductible = 18000;
        }


        const originalDeductible =
            deductible;


        if (
            state.attorneyChoice ===
            "expensive"
        ) {

            deductible =
                Math.round(
                    deductible / 2
                );
        }


        const claimPayment =
            payFromReservesThenRevenue(
                deductible
            );


        state.events.accident = {

            attorneyCost,

            attorneyPayment,

            baseDeductible:
                originalDeductible,

            finalDeductible:
                deductible,

            claimPayment,

            insuranceLevel:

                state.categories.insurance >=
                15000
                ? "Full coverage"

                : state.categories.insurance >=
                  8000
                ? "Limited coverage"

                : "Poor or no coverage"
        };
    }


    /* =====================================================
       PAYROLL AFTER ACCIDENT
       ===================================================== */

    if (s === 17) {

        state.events.payroll5 =
            processPayroll(10000);
    }


    /* =====================================================
       EMPLOYEE PROBLEM RESULT
       ===================================================== */

    if (s === 19) {

        if (
            state.employeeChoice ===
            "hire"
        ) {

            const payment =
                payFromReservesThenRevenue(
                    2500
                );


            state.events.employeeImpact = {

                type: "hire",

                recruitmentCost: 2500,

                payment,

                repChange: 0
            };

        }

        else {

            adjustReputation(3);


            state.events.employeeImpact = {

                type: "owner",

                recruitmentCost: 0,

                repChange: 3
            };
        }
    }


    /* =====================================================
       EMPLOYEE PAYROLL
       ===================================================== */

    if (s === 20) {

        const payrollAmount =

            state.employeeChoice ===
            "owner"

            ? 8000

            : 10000;


        state.events.payroll6 =
            processPayroll(
                payrollAmount
            );


        /*
        Owner covered shifts:
        - no owner payout
        - no rebudgeting
        - revenue split evenly
        */

        if (
            state.employeeChoice ===
            "owner"
        ) {

            const amount =
                state.availableRevenue;


            const keys =
                CATEGORY_META.map(
                    c => c.key
                );


            const baseShare =
                Math.floor(
                    amount /
                    keys.length
                );


            let remainder =
                amount -
                (
                    baseShare *
                    keys.length
                );


            const distribution = {};


            keys.forEach(key => {

                let add =
                    baseShare;


                if (
                    remainder > 0
                ) {

                    add += 1;

                    remainder -= 1;
                }


                state.categories[key] +=
                    add;


                distribution[key] =
                    add;
            });


            state.availableRevenue =
                0;


            state.events.ownerAutoAllocation = {

                amount,

                distribution
            };
        }
    }


    /* =====================================================
       SUMMER EXPANSION RESULT
       ===================================================== */

    if (s === 22) {

        if (
            state.expansionChoice ===
            "open"
        ) {

            state.categories.location -=
                20000;

            earnRevenue(50000);

            adjustReputation(10);


            state.events.expansion = {

                type: "open",

                revenue: 50000,

                repChange: 10
            };

        }

        else {

            earnRevenue(22000);


            state.events.expansion = {

                type: "stay",

                revenue: 22000,

                repChange: 0
            };
        }
    }


    /* =====================================================
       FINAL PAYROLL
       ===================================================== */

    if (s === 23) {

        state.events.finalPayroll =
            processPayroll(10000);
    }


    state.applied[s] = true;

    persist();
}

            (a,b) => a + b,

        .getElementById(

            readMoney(
                "initial_" +
                cat.key
            );


        total +=
            allocations[
                cat.key

    });


    if (
        total !==
        STARTING_BUDGET

        allocations.equipment;


    persist();

    goToStage(1);

function updateFlexibleTotal(
    prefix
) {

    let total = 0;


    CATEGORY_META
    .filter(
        cat =>
            cat.key !==
            "reserves"
    )
    .forEach(cat => {

        total +=
            readMoney(
                prefix +
                "_" +
                cat.key
            );
    });


    total +=
        readMoney(
            prefix +
            "_reserves"
        );


    total +=
        readMoney(
            prefix +
            "_owner"
        );


    total +=
        readMoney(
            prefix +
            "_revenue"
        );


    document
        .getElementById(
            prefix +
            "_total"
        )
        .textContent =
            money(total);


    const pool =
        state.categories.reserves +
        state.availableRevenue;


    const box =
        document.getElementById(
            prefix +
            "_totalBox"
        );


    box.classList.remove(
        "good",
        "over"
    );


    if (
        total === pool
    ) {

        box.classList.add(
            "good"
        );
    }


    if (
        total > pool
    ) {

        box.classList.add(
            "over"
        );
    }
}


function submitFlexibleAllocation(
    prefix,
    next
) {

    const pool =
        state.categories.reserves +
        state.availableRevenue;


    let total = 0;

    const additions = {};


    CATEGORY_META
    .filter(
        cat =>
            cat.key !==
            "reserves"
    )
    .forEach(cat => {

        additions[cat.key] =
            readMoney(
                prefix +
                "_" +
                cat.key
            );


        total +=
            additions[
                cat.key
            ];
    });


    const reserves =
        readMoney(
            prefix +
            "_reserves"
        );


    const owner =
        readMoney(
            prefix +
            "_owner"
        );


    const revenue =
        readMoney(
            prefix +
            "_revenue"
        );


    total +=
        reserves +
        owner +
        revenue;


    if (
        total !== pool
    ) {

        showError(

            prefix +
            "_error",

            "You must account for all " +
            money(pool) +
            " of your available funds."
        );

        return;
    }


    Object.keys(
        additions
    ).forEach(key => {

        state.categories[key] +=
            additions[key];
    });


    state.categories.reserves =
        reserves;


    state.availableRevenue =
        revenue;


    addOwnerPayout(owner);


    persist();

    goToStage(next);
}

function submitReserveOnly(
    prefix,
    next
) {

    const pool =
        state.categories.reserves;


    let total = 0;

    const moves = {};


    CATEGORY_META
    .filter(
        cat =>
            cat.key !==
            "reserves"
    )
    .forEach(cat => {

        moves[cat.key] =
            readMoney(
                prefix +
                "_" +
                cat.key
            );


        total +=
            moves[
                cat.key
            ];
    });


    const reserves =
        readMoney(
            prefix +
            "_reserves"
        );


    total += reserves;


    if (
        total !== pool
    ) {

        showError(

            prefix +
            "_error",

            "You must account for all " +
            money(pool) +
            " currently in Cash Reserves."
        );

        return;
    }


    Object.keys(
        moves
    ).forEach(key => {

        state.categories[key] +=
            moves[key];
    });


    state.categories.reserves =
        reserves;


    persist();

    goToStage(next);
}

                    class="total-box"
                    id="${prefix}_totalBox">

                    <span>
                        Funds Assigned
                    </span>

                    <strong
                        id="${prefix}_total">

                        ${money(pool)}

                    id="${prefix}_error">

}


function updateFullRebudgetTotal(
    prefix
) {

    let total = 0;


    CATEGORY_META.forEach(cat => {

        total +=
            readMoney(
                prefix +
                "_" +
                cat.key
            );
    });


    total +=
        readMoney(
            prefix +
            "_owner"
        );


    total +=
        readMoney(
            prefix +
            "_revenue"
        );


    document
        .getElementById(
            prefix +
            "_total"
        )
        .textContent =
            money(total);


    const pool =
        sumCategories() +
        state.availableRevenue;


    const box =
        document.getElementById(
            prefix +
            "_totalBox"
        );


    box.classList.remove(
        "good",
        "over"
    );


    if (
        total === pool
    ) {

        box.classList.add(
            "good"
        );
    }


    if (
        total > pool
    ) {

        box.classList.add(
            "over"
        );
    }
}


function submitFullRebudget(
    prefix,
    next,
    closeMonth = false
) {

    const pool =
        sumCategories() +
        state.availableRevenue;


    const newBudget = {};

    let total = 0;


    CATEGORY_META.forEach(cat => {

        newBudget[cat.key] =
            readMoney(
                prefix +
                "_" +
                cat.key
            );


        total +=
            newBudget[
                cat.key
            ];
    });


    const owner =
        readMoney(
            prefix +
            "_owner"
        );


    const revenue =
        readMoney(
            prefix +
            "_revenue"
        );


    total +=
        owner +
        revenue;


    if (
        total !== pool
    ) {

        showError(

            prefix +
            "_error",

            "Your new budget must account for all " +
            money(pool) +
            " currently available."
        );

        return;
    }


    state.categories =
        newBudget;


    state.availableRevenue =
        revenue;


    addOwnerPayout(owner);


    if (closeMonth) {

        state.lastMonthOwnerPayout =
            state.currentMonthOwnerPayout;


        state.currentMonthOwnerPayout =
            0;
    }


    persist();

    goToStage(next);
}

                            type="number"
                            min="0"
                            value="${pool}"
                            oninput="updateFinalRevenueTotal()">

                    </div>

                </div>


                <div
                    class="total-box"
                    id="final_totalBox">

                    <span>
                        Funds Assigned
                    </span>

                        id="final_total">

                </div>

                    id="final_error"
                    class="error-box">
                </div>

            </div>

}


function updateFinalRevenueTotal() {

    let total = 0;


    CATEGORY_META.forEach(cat => {

        total +=
            readMoney(
                "final_" +
                cat.key
            );
    });


    total +=
        readMoney(
            "final_owner"
        );


    total +=
        readMoney(
            "final_revenue"
        );


    document
        .getElementById(
            "final_total"
        )
        .textContent =
            money(total);


    const pool =
        state.availableRevenue;


    const box =
        document.getElementById(
            "final_totalBox"
        );


    box.classList.remove(
        "good",
        "over"
    );


    if (
        total === pool
    ) {

        box.classList.add(
            "good"
        );
    }


    if (
        total > pool
    ) {

        box.classList.add(
            "over"
        );
    }
}


function submitFinalRevenue() {

    const pool =
        state.availableRevenue;


    let total = 0;

    const additions = {};


    CATEGORY_META.forEach(cat => {

        additions[cat.key] =
            readMoney(
                "final_" +
                cat.key
            );


        total +=
            additions[
                cat.key
            ];
    });


    const owner =
        readMoney(
            "final_owner"
        );


    const revenue =
        readMoney(
            "final_revenue"
        );


    total +=
        owner +
        revenue;


    if (
        total !== pool
    ) {

        showError(

            "final_error",

            "You must account for all " +
            money(pool) +
            " of your remaining revenue."
        );

        return;
    }


    CATEGORY_META.forEach(cat => {

        state.categories[
            cat.key
        ] +=
            additions[
                cat.key
            ];
    });


    state.availableRevenue =
        revenue;


    addOwnerPayout(owner);


    persist();

    goToStage(24);
}

}


/* =========================================================
   FINAL SCORE
   ========================================================= */

function calculateFinalScore() {

    /*
    40 points = revenue
    35 points = reputation
    25 points = owner payout
    */

    const revenueScore =
        Math.min(
            40,
            Math.round(
                (
                    state.totalRevenue /
                    190000
                ) * 40
            )
        );


    const reputationScore =
        Math.min(
            35,
            Math.max(
                0,
                Math.round(
                    (
                        state.reputation /
                        80
                    ) * 35
                )
            )
        );


    const ownerScore =
        Math.min(
            25,
            Math.round(
                (
                    state.ownerPayout /
                    20000
                ) * 25
            )
        );


    return {

        revenueScore,

        reputationScore,

        ownerScore,

        total:
            revenueScore +
            reputationScore +
            ownerScore
    };
}


function finalRating(
    score
) {

    if (
        score >= 85
    ) {

        return "Outstanding Business Launch";
    }


    if (
        score >= 70
    ) {

        return "Strong Business Launch";
    }


    if (
        score >= 55
    ) {

        return "Promising — But With Some Weak Spots";
    }


    if (
        score >= 40
    ) {

        return "The Business Is Surviving";
    }


    return "The Business Is in Trouble";
}

/* =========================================================
   ERRORS
   ========================================================= */

function showError(
    id,
    message
) {

    const element =
        document.getElementById(id);


    if (!element) {
        return;
    }


    element.textContent =
        message;


    element.style.display =
        "block";


    element.scrollIntoView({
        behavior: "smooth",
        block: "center"
    });
}


/* =========================================================
   RESET
   ========================================================= */

function resetGame() {

    const confirmed =
        confirm(
            "Restart the simulation? All current decisions and scores will be erased."
        );


    if (!confirmed) {
        return;
    }


    localStorage.removeItem(
        STORAGE_KEY
    );


    state =
        freshState();


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });


    render();
}


/* =========================================================
   START GAME
   ========================================================= */

render();

</script>
